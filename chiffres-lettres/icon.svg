<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .bg { fill: #f6f1e9; } .tile { fill: #fffdf9; } .ink { fill: #2b2622; } .plate { fill: #3b6fb0; } .on { fill: #fff; }
    @media (prefers-color-scheme: dark) { .bg { fill: #1c1917; } .tile { fill: #3a3430; } .ink { fill: #f3ede6; } .plate { fill: #5b8fd0; } }
    text { font: 800 20px system-ui, -apple-system, sans-serif; text-anchor: middle; dominant-baseline: central; }
  </style>
  <rect class="bg" width="100" height="100" rx="22"/>
  <!-- Two number plates above, two letter tiles below. -->
  <rect class="plate" x="14" y="16" width="34" height="30" rx="7"/><text class="on" x="31" y="31">75</text>
  <rect class="plate" x="52" y="16" width="34" height="30" rx="7"/><text class="on" x="69" y="31">8</text>
  <rect class="tile" x="14" y="54" width="34" height="30" rx="7" stroke="#d9cfc2"/><text class="ink" x="31" y="69">L</text>
  <rect class="tile" x="52" y="54" width="34" height="30" rx="7" stroke="#d9cfc2"/><text class="ink" x="69" y="69">E</text>
</svg>
