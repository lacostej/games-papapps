<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Mahjong</title>
  <link rel="icon" href="icon.svg">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f6f1e9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="../shared/game-nav.css">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="../shared/game-nav.js"></script>
  <script type="module" src="src/ui/app.js"></script>
</head>
<body>
  <nav data-game-nav="mahjong"></nav>
  <header class="toolbar">
    <select id="layout" data-i18n-label="layout"></select>
    <div class="stat"><span data-i18n="time"></span><b id="time">0:00</b></div>
    <div class="stat"><span data-i18n="pairs"></span><b id="pairs">0</b></div>
  </header>

  <main>
    <p id="status" class="status" aria-live="polite"></p>
    <div id="board-box" class="board-box"><div id="board" class="board" role="group" data-i18n-label="board"></div></div>
    <div class="actions">
      <button id="hint" data-i18n="hint"></button>
      <button id="undo" data-i18n="undo"></button>
      <button id="shuffle" data-i18n="shuffle"></button>
      <button id="new" data-i18n="newGame"></button>
    </div>
  </main>
</body>
</html>
